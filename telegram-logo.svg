<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Brand gradient: coral → calm green, diagonal -->
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#fb7185"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <!-- Subtle radial vignette so the center glyph pops -->
    <radialGradient id="vignette" cx="50%" cy="40%" r="65%">
      <stop offset="0%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".22"/>
    </radialGradient>
    <!-- Inner highlight for depth -->
    <linearGradient id="shine" x1="50%" y1="0%" x2="50%" y2="40%">
      <stop offset="0%"  stop-color="#fff" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- Drop shadow on the glyph for extra punch at thumbnail size -->
    <filter id="glyphShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feFlood flood-color="#000" flood-opacity=".25"/>
      <feComposite in2="off" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Full-bleed gradient (Telegram crops to a circle, but a square is what we upload) -->
  <rect width="512" height="512" fill="url(#brand)"/>

  <!-- Top-half shine for depth -->
  <rect width="512" height="512" fill="url(#shine)"/>

  <!-- Vignette -->
  <rect width="512" height="512" fill="url(#vignette)"/>

  <!-- The /> glyph — bold, centered, large enough to read at 40px thumbnail.
       Stroke-based for crisp scaling at any size. -->
  <g fill="none"
     stroke="#0a0c10" stroke-width="44"
     stroke-linecap="round" stroke-linejoin="round"
     filter="url(#glyphShadow)">
    <!-- forward slash -->
    <line x1="166" y1="358" x2="252" y2="158"/>
    <!-- right angle bracket -->
    <polyline points="288,180 360,256 288,332"/>
  </g>
</svg>
